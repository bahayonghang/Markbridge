<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markbridge · 签桥</title>
  </head>
  <body>
    <main class="panel popup">
      <h1>Markbridge · 签桥</h1>
      <p id="status" role="status">正在读取连接状态</p>
      <p id="write-paused" class="badge badge-caution" hidden>仅只读 · 桌面已暂停写入</p>
      <p id="details"></p>
      <div class="actions">
        <button id="reconnect" class="primary" type="button">重新连接</button>
        <button id="pause" type="button">暂停同步</button>
        <button id="options" type="button">连接状态页</button>
      </div>
      <p id="error" role="alert"></p>
      <section class="well capture-section">
        <h2>采集当前页</h2>
        <p>只在你点击下面的按钮之后，读取当前标签页里的可见文字。不读取密码框、Cookie，也不读取其他标签页。</p>
        <button id="capture" type="button">采集当前页可见文字</button>
        <p id="capture-result"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
