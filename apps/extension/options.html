<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markbridge · 连接状态</title>
  </head>
  <body>
    <main class="panel options">
      <h1>Markbridge · 连接状态</h1>
      <p id="status" role="status">正在读取连接状态</p>
      <p id="write-paused" class="badge badge-caution" hidden>仅只读 · 桌面已暂停写入</p>
      <p id="details"></p>
      <section class="well" aria-labelledby="control-title">
        <h2 id="control-title">连接控制</h2>
        <p>打开 Markbridge 桌面后自动探测本地端口 49153–49160 直连；仅经桌面审查并确认的修改才会写入 Chrome。</p>
        <div class="actions">
          <button id="reconnect" class="primary" type="button">重新连接</button>
          <button id="pause" type="button">暂停同步</button>
        </div>
      </section>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
