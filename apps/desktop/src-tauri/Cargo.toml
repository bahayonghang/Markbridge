[package]
name = "markbridge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
markbridge-core.workspace = true
markbridge-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSApplication", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSURL", "NSString"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKNavigation"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
glib = "=0.18.5"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tauri-runtime = "2.12.1"
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
