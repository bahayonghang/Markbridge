<body>
<a class="skip" href="#main">跳至内容</a>
<div class="app">
<aside class="sidebar" aria-label="主导航">
 <div class="brand"><span class="brandmark" data-icon="bookmark"></span><strong>Markbridge</strong></div>
 <button class="source" data-action="settings" aria-label="Chrome 资料与连接设置"><span class="avatar">C</span><span class="grow"><b>Chrome 个人资料</b><small>本机书签库</small></span><span data-icon="chevrons"></span></button>
 <nav class="navlist"><button class="navitem active" data-nav="library" aria-label="全部书签"><span data-icon="library"></span><span>全部书签</span><span class="count">12</span></button><button class="navitem compact-folders" data-action="folders" aria-label="文件夹导航"><i data-icon="folder"></i></button></nav>
 <div class="tree"><div class="navlabel">文件夹</div><nav class="navlist" id="folders"><button class="navitem" data-folder="书签栏"><i data-icon="chevron"></i><i data-icon="folder"></i><span>书签栏</span></button><button class="navitem indent" data-folder="设计与产品"><i data-icon="folder"></i><span>设计与产品</span><span class="count">4</span></button><button class="navitem indent" data-folder="开发参考"><i data-icon="folder"></i><span>开发参考</span><span class="count">4</span></button><button class="navitem indent" data-folder="阅读清单"><i data-icon="folder"></i><span>阅读清单</span><span class="count">4</span></button><button class="navitem" data-folder="其他书签"><i data-icon="chevron"></i><i data-icon="folder"></i><span>其他书签</span></button></nav><div class="navlabel">本地标签</div><nav class="navlist"><button class="navitem" data-tag="设计"><i class="tagdot"></i><span>设计</span></button><button class="navitem" data-tag="开发"><i class="tagdot green"></i><span>开发</span></button><button class="navitem" data-tag="待读"><i class="tagdot orange"></i><span>待读</span></button></nav></div>
 <nav class="navlist navbottom"><button class="navitem" data-nav="organize" aria-label="整理"><i data-icon="spark"></i><span>整理</span></button><button class="navitem" data-nav="history" aria-label="操作历史"><i data-icon="history"></i><span>操作历史</span></button><button class="navitem" data-nav="settings" aria-label="设置"><i data-icon="settings"></i><span>设置</span></button></nav>
</aside>
<main class="main" id="main" tabindex="-1">
 <header class="topbar"><div class="breadcrumb"><span>书签库</span><span>›</span><b id="crumb">全部书签</b></div><div class="grow"></div><span class="status" id="status"><i></i>实时同步</span><button class="iconbtn" data-action="settings" aria-label="连接详情"><i data-icon="connection"></i></button></header>
 <div id="surface" class="main grow"></div>
 <footer class="footer"><span id="footcount">12 个书签</span><span class="grow"></span><span>设计预览 · 示例数据</span><button data-action="scene" title="切换已连接、未接入、离线场景">切换场景</button></footer>
</main>
</div>
<dialog id="dialog"><h2 id="dialogtitle"></h2><div id="dialogbody"></div><div class="actions"><button class="secondary" id="cancel">取消</button><button class="primary" id="confirm">确认</button></div></dialog><div class="toast hidden" id="toast" role="status"></div>
<script>
const paths={bookmark:'M5 3h14v18l-7-4-7 4Z',library:'M4 4h4v16H4zM11 4h4v16h-4zM18 5l3 14',folder:'M3 6h6l2 2h10v12H3ZM3 6V4h6l2 2',chevron:'m9 6 6 6-6 6',chevrons:'m9 8 3-3 3 3M9 16l3 3 3-3',search:'M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14Zm5-2 6 6',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M18 6 6 18',arrow:'M7 17 17 7M7 7h10v10',more:'M5 12h.01M12 12h.01M19 12h.01',panel:'M3 4h18v16H3ZM15 4v16',history:'M3 10a9 9 0 1 1 1 7M3 4v6h6M12 7v5l3 2',settings:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4',connection:'M8 8V3M16 8V3M5 8h14v4a7 7 0 0 1-14 0ZM12 19v3',tag:'M3 3h8l10 10-8 8L3 11ZM7 7h.01',back:'m14 5-7 7 7 7',download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4',link:'m9 15 6-6M7 14l-2 2a3 3 0 0 0 4 4l4-4M11 8l4-4a3 3 0 0 1 4 4l-2 2',trash:'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',check:'m5 12 4 4L19 6'};

function icons(){document.querySelectorAll('[data-icon]').forEach(e=>{e.innerHTML=icon(e.dataset.icon);e.removeAttribute('data-icon')})}
const data=[
['Human Interface Guidelines','developer.apple.com','设计与产品','设计','A','https://developer.apple.com/design/human-interface-guidelines/'],
['Thinking in React','react.dev','开发参考','开发','R','https://react.dev/learn/thinking-in-react'],
['设计系统里的留白与秩序','designsystems.com','设计与产品','设计','D','https://www.designsystems.com/'],
['Tauri 2 · 桌面应用开发','v2.tauri.app','开发参考','开发','T','https://v2.tauri.app/'],
['A List Apart · 设计、内容与体验','alistapart.com','阅读清单','待读','A','https://alistapart.com/'],
['TypeScript Handbook','typescriptlang.org','开发参考','开发','TS','https://www.typescriptlang.org/docs/handbook/intro.html'],
['Figma · 组件与设计系统','figma.com','设计与产品','设计','F','https://www.figma.com/'],
['The Shape of Design','shapeofdesignbook.com','阅读清单','待读','S','https://shapeofdesignbook.com/'],
['SQLite Documentation','sqlite.org','开发参考','开发','S','https://www.sqlite.org/docs.html'],
['可访问性：让键盘也能完成每一步','w3.org','设计与产品','设计','W','https://www.w3.org/WAI/'],
['Web.dev · 更好的网页体验','web.dev','阅读清单','待读','W','https://web.dev/'],
['CSS 的层次与组织','developer.mozilla.org','阅读清单','待读','M','https://developer.mozilla.org/']
].map((a,id)=>({id,title:a[0],host:a[1],folder:a[2],tag:a[3],letter:a[4],url:a[5]}));
let state={nav:'library',folder:'全部书签',tag:'',query:'',selected:0,detail:innerWidth>=1100,picked:new Set(),scene:0,tab:'Chrome 连接'},toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),3000)}
function matching(){return data.filter(d=>(state.folder==='全部书签'||state.folder==='书签栏'||d.folder===state.folder)&&(!state.tag||d.tag===state.tag)&&(!state.query||(d.title+' '+d.host).toLowerCase().includes(state.query.toLowerCase())))}
function row(d){return `<div class="row ${d.id===state.selected?'selected':''} ${state.picked.has(d.id)?'picked':''}" data-row="${d.id}" tabindex="0" aria-label="${esc(d.title)}"><label class="checkcell"><input type="checkbox" data-pick="${d.id}" aria-label="选择 ${esc(d.title)}" ${state.picked.has(d.id)?'checked':''}></label><span class="siteicon">${d.letter}</span><div class="nameblock"><strong>${esc(d.title)}</strong><small>${d.host}</small></div><div class="tagcol"><span class="tag">${d.tag}</span></div><button class="iconbtn more" data-more="${d.id}" aria-label="${esc(d.title)} 的操作">${icon('more')}</button></div>`}
function inspector(){const d=data.find(d=>d.id===state.selected)||data[0];return `<aside class="inspector" aria-label="书签详情"><div class="inspecthead"><button class="backdetail" data-action="close-detail">${icon('back')}返回列表</button><span class="muted">书签详情</span><button class="iconbtn" data-action="close-detail" aria-label="关闭详情">${icon('close')}</button></div><div class="detailhero"><span class="siteicon">${d.letter}</span><h2>${esc(d.title)}</h2><a href="#" data-action="open">${d.host}</a><div class="detailactions"><button class="primary" data-action="open">在浏览器打开${icon('arrow')}</button><button class="secondary" data-action="edit">编辑</button></div></div><div class="detailsection"><dl class="detailmeta"><dt>位置</dt><dd style="margin:0"><b>书签栏 / ${d.folder}</b></dd><dt>网址</dt><dd style="margin:0;overflow-wrap:anywhere">${d.url}</dd></dl></div><div class="detailsection"><h3>本地标签</h3><span class="tag">${d.tag}</span><button class="chip" data-action="tags" style="margin-left:6px">＋ 添加</button></div><div class="detailsection"><h3>备注</h3><textarea aria-label="书签备注" placeholder="记下值得保留的想法…">${d.id===0?'界面层次、导航与交互反馈的参考。\n下次检查表单和空状态。':''}</textarea><div class="caption">仅保存在本机</div></div><div class="detailsection"><h3>内容预览</h3><p>${d.id===0?'从清晰的层次、一致的交互和熟悉的导航开始，让用户专注于要完成的事情。':'选择需要的内容，再按需加载页面摘要。'}</p><div class="caption">示例摘要，非实时抓取</div><button class="secondary" style="margin-top:12px" data-action="preview">${icon('panel')}打开网页预览</button></div></aside>`}
function library(){const rows=matching(),multi=state.picked.size>0;return `${multi?`<div class="batchbar"><strong>已选 ${state.picked.size} 项</strong><button data-action="move">${icon('folder')}移动</button><button data-action="tags">标签</button><button class="danger" data-action="delete">${icon('trash')}删除</button><button class="iconbtn" data-action="clear-picks" aria-label="取消选择">${icon('close')}</button></div>`:`<div class="toolbar"><label class="search">${icon('search')}<input id="query" type="search" placeholder="搜索标题或网址" aria-label="搜索书签" value="${esc(state.query)}"><span class="keycap">Ctrl K</span></label><div class="grow"></div><button class="iconbtn" data-action="detail" aria-label="切换详情">${icon('panel')}</button><button class="primary" data-action="new">${icon('plus')}新建</button></div>`}<div class="content ${state.detail&&!multi?'has-detail':''}"><section class="listpane" aria-label="书签列表"><div class="listtitle"><div class="grow"><h1>${state.query?'搜索结果':state.folder}</h1><p>${state.query?'当前资料中的匹配项':state.folder==='全部书签'?'按 Chrome 中的目录与顺序显示。':'书签栏 / '+state.folder}</p></div></div><div class="scope"><button class="chip selected" data-action="all">当前资料</button>${state.tag?`<button class="chip selected" data-action="clear-tag">${state.tag} ×</button>`:'<span>按 Chrome 顺序</span>'}<span class="grow"></span><span>${rows.length} 项</span></div><div class="tablehead"><label class="checkcell"><input type="checkbox" id="allchecks" aria-label="选择已显示结果" ${rows.length&&rows.every(d=>state.picked.has(d.id))?'checked':''}></label><span class="name">名称 / 站点</span><span class="tagcol">标签</span><span style="width:40px"></span></div><div class="rows" id="rows">${rows.length?rows.map(row).join(''):'<div style="padding:40px 20px"><h2>这里还没有书签</h2><p class="muted">换个搜索词，或在当前文件夹新建书签。</p><button class="secondary" style="margin-top:16px" data-action="new">新建书签</button></div>'}</div></section>${state.detail&&!multi?inspector():''}</div>`}
function settings(){return `<section class="page"><div class="pageintro"><h1>设置</h1><p>管理 Chrome 连接、AI 与本地导出。</p></div><nav class="tabs">${['Chrome 连接','AI','备份导出'].map(t=>`<button class="${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</nav>${state.tab==='Chrome 连接'?`<div class="settingsgroup"><h2>已连接的资料</h2><div class="settingrow"><span class="avatar">C</span><div class="grow"><strong>Chrome 个人资料</strong><p>本机书签库，12 个示例书签</p></div><span class="status"><i></i>实时同步</span><button class="secondary" data-action="reconnect">重新连接</button></div></div><div class="settingsgroup"><h2>添加书签来源</h2><div class="settingrow"><div class="grow"><strong>连接另一个 Chrome 资料</strong><p>通过扩展配对，浏览和管理现有书签。</p></div><button class="primary" data-action="onboard">添加资料</button></div><div class="settingrow"><div class="grow"><strong>只读浏览本地文件</strong><p>读取 Chrome 书签文件，仅用于浏览。</p></div><button class="secondary" data-action="readonly">选择目录</button></div></div><details class="settingsgroup"><summary style="cursor:pointer;padding:12px 0">高级连接设置</summary><div class="formrow"><label class="field">本机端口<input value="49153" inputmode="numeric"></label></div><p class="muted tiny">仅连接本机，端口冲突时可调整。</p></details>`:state.tab==='AI'?`<div class="settingsgroup"><div class="settingrow"><div class="grow"><strong>AI 辅助</strong><p>按需生成建议，确认后才修改书签。</p></div><button class="secondary" data-action="ai">默认关闭</button></div><div class="formrow"><label class="field">提供方<select><option>选择提供方</option><option>Ollama</option><option>兼容端点</option></select></label><label class="field">模型<input placeholder="模型名称"></label><label class="field">端点<input placeholder="填写模型服务地址"></label><label class="field">密钥<input type="password" placeholder="仅存入系统凭据存储"></label></div><button class="primary" data-action="save-settings">保存配置</button><button data-action="test-ai">测试连接</button></div>`:`<div class="settingsgroup"><h2>导出当前资料</h2><div class="settingrow"><div class="grow"><strong>书签 HTML</strong><p>保存目录、书签标题和网址。</p></div><button class="secondary" data-action="export">${icon('download')}导出</button></div><div class="settingrow"><div class="grow"><strong>本地标签与备注</strong><p>单独保存为侧车 JSON，不写入 Chrome。</p></div><button class="secondary" data-action="export">${icon('download')}导出</button></div><p class="muted tiny" style="margin-top:20px">恢复已执行的修改，请前往操作历史。</p></div>`}</section>`}
function organize(){return `<section class="page"><div class="pageintro"><h1>整理书签</h1><p>检查重复、失效链接，并审查整理建议。</p></div><div class="notice">范围：${state.picked.size?'已选 '+state.picked.size+' 个书签':'尚未选择'}。<button data-action="library" style="min-height:24px;padding:0 6px;color:var(--blue)">返回书签选择范围</button></div>${[['link','重复书签','按网址查找重复项，自行选择保留哪一个。','检查重复'],['connection','链接检查','区分失效和暂时无法访问，不自动删除。','检查链接'],['spark','AI 整理','先审查分类与移动建议，确认后应用。','配置 AI']].map(a=>`<div class="organize-item"><span class="siteicon">${icon(a[0])}</span><div class="grow"><h2>${a[1]}</h2><p>${a[2]}</p></div><button class="secondary" data-action="${a[0]==='spark'?'ai-settings':'run-check'}">${a[3]}</button></div>`).join('')}</section>`}
function history(){return `<section class="page"><div class="pageintro" style="display:flex;gap:16px"><div class="grow"><h1>操作历史</h1><p>查看已执行的修改，审查可撤销的操作。</p></div><button class="secondary" data-action="backup">${icon('download')}备份导出</button></div><div class="notice">以下为示例记录，用于展示审查与撤销流程。</div>${[['14:32','移动 3 个书签','阅读清单 → 设计与产品'],['11:08','修改书签标题','Human Interface Guidelines'],['昨天','添加本地标签','4 个书签添加「开发」']].map(a=>`<div class="historyrow"><span class="stamp">${a[0]}</span><div class="grow"><h3>${a[1]}</h3><p class="muted tiny">${a[2]}</p></div><span class="success">已确认</span><button data-action="undo">审查撤销</button></div>`).join('')}</section>`}
function onboarding(){return `<section class="page" style="display:flex"><div class="empty"><div class="brandmark">${icon('bookmark')}</div><h1>连接你的 Chrome 书签</h1><p>连接现有书签库，在这里浏览、编辑和整理。<br>书签仍由 Chrome 管理，本地备注留在这台电脑。</p><div class="steps"><div class="step"><span class="stepnum">1</span><div><strong>准备 Markbridge 扩展</strong><p>在需要管理的 Chrome 资料中加载扩展。</p></div></div><div class="step"><span class="stepnum">2</span><div><strong>完成两端配对</strong><p>在扩展输入配对串，回到这里确认资料。</p></div></div><div class="step"><span class="stepnum">3</span><div><strong>开始管理书签</strong><p>核对完成后显示书签，连接中断时仍可只读浏览。</p></div></div></div><button class="primary" data-action="demo-connect">连接 Chrome</button><button data-action="readonly">先只读浏览</button></div></section>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.nav));document.querySelectorAll('[data-folder]').forEach(b=>b.classList.toggle('active',b.dataset.folder===state.folder&&state.nav==='library'));document.querySelector('#crumb').textContent=({library:state.folder,organize:'整理',history:'操作历史',settings:'设置'})[state.nav];document.querySelector('#status').innerHTML=state.scene===1?'未接入':state.scene===2?'缓存只读':`<i></i>实时同步`;document.querySelector('#surface').innerHTML=state.nav==='settings'?settings():state.nav==='organize'?organize():state.nav==='history'?history():state.scene===1?onboarding():library();document.querySelector('#footcount').textContent=state.scene===1?'尚未接入书签来源':state.picked.size?'已选 '+state.picked.size+' 项':matching().length+' 个书签';document.querySelector('.tree').classList.toggle('hidden',state.scene===1);document.querySelector('.source b').textContent=state.scene===1?'尚未连接资料':'Chrome 个人资料';document.querySelector('.source small').textContent=state.scene===1?'开始接入书签':'本机书签库';document.querySelector('[data-nav=library] .count').textContent=state.scene===1?'':'12';icons();if(state.scene===2){document.querySelectorAll('[data-action="new"],[data-action="edit"],[data-action="move"],[data-action="delete"]').forEach(b=>{b.disabled=true;b.title='缓存只读，连接恢复后可修改Chrome'})}}
function modal(title,body,confirm='确认演示'){document.querySelector('#dialogtitle').textContent=title;document.querySelector('#dialogbody').innerHTML=body;document.querySelector('#confirm').textContent=confirm;document.querySelector('#dialog').showModal()}
document.addEventListener('click',e=>{if(e.target.matches('input,textarea,select'))return;const nav=e.target.closest('[data-nav]'),folder=e.target.closest('[data-folder]'),tag=e.target.closest('[data-tag]'),tab=e.target.closest('[data-tab]'),more=e.target.closest('[data-more]');if(nav){state.nav=nav.dataset.nav;render();return}if(folder){state.folder=folder.dataset.folder;state.query='';state.picked.clear();state.detail=false;state.nav='library';render();return}if(tag){state.tag=tag.dataset.tag;state.picked.clear();state.nav='library';state.detail=false;render();return}if(tab){state.tab=tab.dataset.tab;render();return}if(more){state.selected=Number(more.dataset.more);modal('书签操作','<p>编辑、移动、删除均先展示差异。此处仅演示操作入口。</p>');return}const a=e.target.closest('[data-action]')?.dataset.action;if(a){e.preventDefault();if(['settings','history','organize','library'].includes(a)){state.nav=a;render()}else if(a==='close-detail'){state.detail=false;render()}else if(a==='detail'){state.detail=!state.detail;render()}else if(a==='clear-picks'){state.picked.clear();render()}else if(a==='clear-tag'){state.tag='';render()}else if(a==='all'){state.folder='全部书签';render()}else if(a==='new'||a==='edit'){modal(a==='new'?'新建书签':'编辑书签',`<div class="formrow" style="grid-template-columns:1fr"><label class="field">标题<input placeholder="为书签起个名字" value="${a==='edit'?esc(data[state.selected].title):''}"></label><label class="field">网址<input placeholder="https://" value="${a==='edit'?esc(data[state.selected].url):''}"></label><label class="field">位置<select><option>设计与产品</option><option>开发参考</option><option>阅读清单</option></select></label></div><p>设计演示，确认不会写入 Chrome。</p>`,'审查修改')}else if(a==='move'){modal('移动 '+state.picked.size+' 个书签','<p>选择目标文件夹，确认前查看完整影响。</p><div class="formrow"><label class="field">目标位置<select><option>书签栏 / 设计与产品</option><option>书签栏 / 开发参考</option><option>书签栏 / 阅读清单</option></select></label></div><p>设计演示，不执行真实移动。</p>','审查移动')}else if(a==='delete'){modal('审查删除',`<p>已选 ${state.picked.size} 项。产品中会展示完整清单及备份结果，确认后执行。</p><p>本原型不删除任何数据。</p>`)}else if(a==='tags'){modal('本地标签','<label class="field" style="margin:20px 0">标签<input placeholder="输入标签"></label><p>本地标签不改写 Chrome 标题。</p>','保存演示')}else if(a==='undo'){modal('审查撤销','<p>恢复本次操作前的目录与顺序。产品中会逐项核对后续外部修改，有冲突则保留外部值。</p><p>此处没有真实操作可以撤销。</p>')}else if(a==='scene'){state.scene=(state.scene+1)%3;state.nav='library';state.picked.clear();state.detail=false;render()}else if(a==='onboard'){state.scene=1;state.nav='library';render()}else if(a==='demo-connect'){state.scene=0;state.nav='library';render();notify('仅切换到已连接设计场景，未连接真实 Chrome。')}else if(a==='ai-settings'||a==='backup'){state.nav='settings';state.tab=a==='backup'?'备份导出':'AI';render()}else if(a==='folders'){modal('文件夹导航','<div class="navlist">'+['全部书签','设计与产品','开发参考','阅读清单'].map(f=>`<button data-folder="${f}" onclick="document.querySelector(\'#dialog\').close()">${icon('folder')}${f}</button>`).join('')+'</div>')}else notify('设计预览：此操作尚未接入后端，不会修改书签或发起网络请求。');return}const r=e.target.closest('[data-row]');if(r&&!e.target.closest('label')){state.selected=Number(r.dataset.row);state.detail=true;render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-pick]')){const id=Number(e.target.dataset.pick);e.target.checked?state.picked.add(id):state.picked.delete(id);render()}if(e.target.id==='allchecks'){state.picked=e.target.checked?new Set(matching().map(d=>d.id)):new Set();render()}});
document.addEventListener('input',e=>{if(e.target.id==='query'){state.query=e.target.value;state.picked.clear();const caret=e.target.selectionStart;render();const q=document.querySelector('#query');q.focus();try{q.setSelectionRange(caret,caret)}catch{}}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.nav='library';state.picked.clear();render();document.querySelector('#query')?.focus()}if(e.key==='Escape'&&!document.querySelector('#dialog').open){state.detail=false;render()}if(e.key==='Enter'&&e.target.matches('[data-row]')){state.selected=Number(e.target.dataset.row);state.detail=true;render()}});
document.querySelector('#cancel').onclick=()=>document.querySelector('#dialog').close();document.querySelector('#confirm').onclick=()=>{document.querySelector('#dialog').close();notify('已完成界面演示。没有保存、发送或修改真实数据。')};
render();
</script>
</body></html>
