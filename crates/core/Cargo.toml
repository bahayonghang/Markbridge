[package]
name = "markbridge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
markbridge-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["sync", "net", "time", "rt", "macros", "io-util", "io-std"] }
tokio-tungstenite = "=0.28.0"
futures-util = { version = "0.3", features = ["sink"] }
rand = "=0.9.2"
subtle = "2.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.1", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
