[workspace]
members = ["apps/desktop/src-tauri", "crates/core", "crates/protocol"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
markbridge-protocol = { path = "crates/protocol" }
markbridge-core = { path = "crates/core" }
